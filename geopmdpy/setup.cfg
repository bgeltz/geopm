[# NOTE]
# Legacy setuptools config retained only minimally to support `python setup.py clean`
# during Debian package build. Full metadata now lives in pyproject.toml (PEP 621).
# Removed deprecated `setup_requires` to avoid triggering setuptools legacy
# fetch_build_eggs path which caused a TypeError under Python 3.12.

[metadata]
name = geopmdpy

[options]
packages = geopmdpy
python_requires = >=3.6

[options.package_data]
geopmdpy = VERSION
